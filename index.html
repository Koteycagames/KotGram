<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kotogram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="call-modal" class="call-modal">
        <div class="call-content">
            <h3 id="call-status">Звонок...</h3>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="call-buttons">
                <button id="btn-answer" class="btn-call green" onclick="answerCall()">📞</button>
                <button id="btn-hangup" class="btn-call red" onclick="hangUp()">❌</button>
            </div>
        </div>
    </div>

    <div class="drawer-overlay" onclick="toggleMenu()"></div>
    <div class="drawer" id="main-drawer">
        <div class="drawer-header">
            <div id="drawer-avatar" onclick="document.getElementById('avatar-upload').click()">📷</div>
            <div id="drawer-name">Загрузка...</div>
            <input type="file" id="avatar-upload" hidden accept="image/*" onchange="uploadAvatar(this)">
        </div>
        <div class="drawer-list">
            <div onclick="openSettings()">⚙️ Настройки</div>
            <div onclick="toggleMenu()">⬅ Закрыть</div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <h3>Настройки</h3>
            <p>Размер шрифта: <span id="font-val">16</span>px</p>
            <input type="range" min="12" max="24" value="16" oninput="changeFontSize(this.value)">
            <button class="btn-main" onclick="closeSettings()">Закрыть</button>
        </div>
    </div>

    <div id="auth-container">
        <div id="screen-phone" class="screen active">
            <div class="card">
                <h2>Kotogram</h2>
                <div id="recaptcha-container"></div>
                <input type="tel" id="phone-number" placeholder="+7 999 000 00 00" value="+7">
                <button id="btn-login" class="btn-main" onclick="sendSms()">Продолжить</button>
            </div>
        </div>
        <div id="screen-code" class="screen">
            <div class="card">
                <h2>Код</h2>
                <input type="number" id="verification-code" placeholder="123456">
                <button class="btn-main" onclick="verifyCode()">Войти</button>
            </div>
        </div>
        <div id="screen-nickname" class="screen">
            <div class="card">
                <h2>Имя</h2>
                <input type="text" id="username-input" placeholder="Никнейм">
                <button class="btn-main" onclick="saveProfile()">Готово</button>
            </div>
        </div>
    </div>

    <div id="app-layout">
        
        <aside class="sidebar">
            <div class="header">
                <button onclick="toggleMenu()">☰</button>
                <input type="text" placeholder="Поиск">
            </div>
            <div id="chats-list" class="scrollable"></div>
            <button class="fab" onclick="addContactPrompt()">✏️</button>
        </aside>

        <main class="chat-area" id="chat-area">
            <div class="header">
                <button class="back-btn" onclick="closeChat()">⬅</button>
                <div id="header-avatar" class="avatar-small"></div>
                <div class="header-text">
                    <b id="chat-header-name">Чат</b>
                    <span id="chat-header-status">...</span>
                </div>
                <button onclick="startCall()">📞</button>
            </div>

            <div id="messages-area" class="scrollable">
                <div class="placeholder">Выберите чат</div>
            </div>

            <div class="input-row">
                <button onclick="document.getElementById('img-input').click()">📎</button>
                <input type="file" id="img-input" hidden accept="image/*" onchange="sendImage(this)">
                <input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="handleEnter(event)" oninput="handleTyping()">
                <button onclick="sendMessage()" style="color:#3390ec">➤</button>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        // Заглушки
        window.sendSms=()=>{};window.verifyCode=()=>{};window.saveProfile=()=>{};
        window.toggleMenu=()=>{};window.openSettings=()=>{};window.closeSettings=()=>{};
        window.changeFontSize=()=>{};window.addContactPrompt=()=>{};window.sendMessage=()=>{};
        window.closeChat=()=>{};window.handleEnter=()=>{};window.handleTyping=()=>{};
        window.uploadAvatar=()=>{};window.sendImage=()=>{};window.startCall=()=>{};
        window.answerCall=()=>{};window.hangUp=()=>{};
    </script>
</body>
</html>
