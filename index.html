<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kotogram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="call-modal" class="call-modal">
        <div class="call-content">
            <h3 id="call-status">Звонок...</h3>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="call-controls">
                <button id="btn-answer" class="btn-green" style="display:none" onclick="answerCall()">📞</button>
                <button id="btn-hangup" class="btn-red" onclick="hangUp()">❌</button>
            </div>
        </div>
    </div>

    <div class="drawer-overlay" onclick="toggleMenu()"></div>
    <div class="drawer" id="main-drawer">
        <div class="drawer-header">
            <div id="drawer-avatar" class="drawer-avatar-big" onclick="document.getElementById('avatar-upload').click()">📷</div>
            <div id="drawer-name" class="drawer-username">Загрузка...</div>
            <div id="drawer-phone" class="drawer-phone">+7...</div>
            <input type="file" id="avatar-upload" hidden accept="image/*" onchange="uploadAvatar(this)">
        </div>
        <div class="drawer-menu">
            <div class="drawer-item" onclick="openSettings()"><span>⚙️</span> Настройки</div>
            <div class="drawer-item" onclick="toggleMenu()"><span>❌</span> Закрыть</div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Настройки</h3>
            <div class="setting-group">
                <label>Размер текста: <span id="font-val">16</span>px</label>
                <input type="range" min="12" max="24" value="16" oninput="changeFontSize(this.value)">
            </div>
            <button class="btn-primary" onclick="closeSettings()">Закрыть</button>
        </div>
    </div>

    <div id="loader"><div class="spinner"></div></div>

    <div id="auth-screens">
        <div id="screen-phone" class="screen active">
            <div class="auth-card">
                <h2>Kotogram</h2>
                <div id="recaptcha-container"></div>
                <input type="tel" id="phone-number" placeholder="+7 999 000 00 00" value="+7">
                <button id="btn-login" class="btn-primary" onclick="sendSms()" disabled>Загрузка...</button>
            </div>
        </div>
        <div id="screen-code" class="screen">
            <div class="auth-card">
                <h2>Код из SMS</h2>
                <input type="number" id="verification-code" placeholder="123456">
                <button class="btn-primary" onclick="verifyCode()">Войти</button>
            </div>
        </div>
        <div id="screen-nickname" class="screen">
            <div class="auth-card">
                <h2>Ваше имя</h2>
                <input type="text" id="username-input" placeholder="Никнейм">
                <button class="btn-primary" onclick="saveProfile()">Готово</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
                <div class="search-wrap"><input type="text" placeholder="Поиск"></div>
            </div>
            <div id="chats-list"></div>
            <button class="fab-pencil" onclick="addContactPrompt()">✏️</button>
        </div>

        <div class="chat-window">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChat()">⬅</button>
                <div id="header-avatar" class="avatar-small"></div>
                <div class="header-info">
                    <div id="chat-header-name" class="header-name">Kotogram</div>
                    <div id="chat-header-status" class="header-status">...</div>
                </div>
                <button class="call-btn" onclick="startCall()">📞</button>
            </div>

            <div id="messages-area">
                <div class="empty-placeholder">Выберите чат</div>
            </div>

            <div class="input-area">
                <button class="attach-btn" onclick="document.getElementById('img-input').click()">📎</button>
                <input type="file" id="img-input" hidden accept="image/*" onchange="sendImage(this)">
                <input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="handleEnter(event)" oninput="handleTyping()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        window.sendSms = () => {}; window.verifyCode = () => {}; window.saveProfile = () => {};
        window.toggleMenu = () => {}; window.openSettings = () => {}; window.closeSettings = () => {};
        window.changeFontSize = () => {}; window.addContactPrompt = () => {}; window.sendMessage = () => {};
        window.closeChat = () => {}; window.handleEnter = () => {}; window.handleTyping = () => {};
        window.uploadAvatar = () => {}; window.sendImage = () => {}; window.startCall = () => {};
        window.answerCall = () => {}; window.hangUp = () => {};
    </script>
</body>
</html>
